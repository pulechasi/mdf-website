name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing npm dependencies..."
          npm ci || { echo "❌ NPM install failed"; exit 1; }

      - name: Build frontend assets
        run: |
          echo "🎨 Building frontend assets..."
          npm run build || { echo "❌ NPM build failed"; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            public/css
            public/js
            public/mix-manifest.json

      - name: Test SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          timeout: 300s
          debug: true
          script: |
            echo "Testing SSH connection..."
            whoami
            pwd
            echo "Connection successful!"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          timeout: 300s
          command_timeout: 15m
          debug: true
          script: |
            cd /home/mdf/public_html || { echo "Failed to cd"; exit 1; }
            php artisan down || true
            git pull origin main || { echo "Git pull failed"; exit 1; }
            composer install --no-dev --optimize-autoloader --no-interaction || { echo "Composer failed"; exit 1; }
            php artisan migrate --force || { echo "Migrations failed"; exit 1; }
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache
            php artisan up
            echo "Deployment completed successfully on $(date)"
