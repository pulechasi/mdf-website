name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SETUP NODE & BUILD FRONTEND ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # or your version
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # --- DEPLOY BUILT FILES TO SERVER ---
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          timeout: 60s
          command_timeout: 10m
          script: |
            echo "🚀 Starting deployment on $(date)"
            cd /home/mdf/public_html || { echo "❌ Failed to cd"; exit 1; }

            # Enable maintenance
            php artisan down || true

            # Backup current release (optional)
            # mv public/build public/build_backup_$(date +%s) || true

            # Pull latest code (includes built assets)
            git pull origin main || { echo "❌ Git pull failed"; exit 1; }

            # Composer
            composer install --no-dev --optimize-autoloader --no-interaction || { echo "❌ Composer failed"; exit 1; }

            # Migrations
            php artisan migrate --force || { echo "❌ Migrate failed"; exit 1; }

            # Clear & cache
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Queue restart
            php artisan queue:restart

            # Permissions
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache

            # Disable maintenance
            php artisan up

            echo "🎉 Deployment completed on $(date)"
